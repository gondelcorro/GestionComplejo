<br>
<div>
  <h1><strong>Pagos</strong></h1>
</div>

<div *ngIf="listaPago.data != 0">
  <mat-form-field appearance="standard" style="width: 100%">
    <mat-label>Búsqueda</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ingrese un número de pago, código de reserva o fecha" #input>
  </mat-form-field>
</div>

<table mat-table [dataSource]="listaPago" class="mat-elevation-z8" *ngIf="listaPago.data != 0">
  <ng-container matColumnDef="Reintegro">
    <th mat-header-cell *matHeaderCellDef> Reintegro</th>
    <!--<td [ngClass]="pago.reintegro ? 'reintegro-si' : 'reintegro-no'" mat-cell *matCellDef="let pago">{{pago.reintegro? "Si" : "No"}} </td>-->
    <td  mat-cell *matCellDef="let pago"><mat-icon *ngIf="!pago.reintegro">close</mat-icon> <mat-icon *ngIf="pago.reintegro">done</mat-icon> </td>
  </ng-container>
  <ng-container matColumnDef="NumPago">
    <th mat-header-cell *matHeaderCellDef> N° de referencia</th>
    <td mat-cell *matCellDef="let pago"> {{pago.numeroPago}} </td>
  </ng-container>
  <ng-container matColumnDef="Estado">
    <th mat-header-cell *matHeaderCellDef> Estado</th>
    <td mat-cell *matCellDef="let pago"> {{pago.estado}} </td>
  </ng-container>
  <ng-container matColumnDef="MedioPago">
    <th mat-header-cell *matHeaderCellDef> Medio pago</th>
    <td mat-cell *matCellDef="let pago"> {{pago.medioPago}} </td>
  </ng-container>
  <ng-container matColumnDef="Importe">
    <th mat-header-cell *matHeaderCellDef> Importe</th>
    <td mat-cell *matCellDef="let pago"> {{pago.importe | currency: "ARS"}} </td>
  </ng-container>
  <ng-container matColumnDef="Fecha">
    <th mat-header-cell *matHeaderCellDef> Fecha</th>
    <td mat-cell *matCellDef="let pago"> {{pago.fecha | date: "dd-MM-yyyy"}} </td>
  </ng-container>
  <ng-container matColumnDef="Acciones">
    <th mat-header-cell *matHeaderCellDef> Acciones</th>
    <td mat-cell *matCellDef="let pago">
      <button mat-button color="primary" (click)="verReserva(pago)" style="cursor: pointer">
        <mat-icon>calendar_today</mat-icon>
        Ver reserva
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  <!-- Row shown when there is no matching data. -->
  <!--<tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="7" *ngIf="input.value != '' ">Ningún registro coincide con el valor de búsqueda ingresado "{{input.value}}"</td>
  </tr>-->
</table>

<div *ngIf="listaPago.data == 0">
  <h2 style="margin-left: 20px">* Aún no tenés pagos registrados.</h2>
</div>

<div *ngIf="listaPago.data != 0">
  <mat-paginator [pageSizeOptions]="[10, 20, 30]" [length]="cantidad" showFirstLastButtons ></mat-paginator> <!--(page)="mostrarMas($event)"-->
</div>
