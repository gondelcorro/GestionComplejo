<table mat-table [dataSource]="listaPago" class="mat-elevation-z8">

    <ng-container matColumnDef="NumRef">
        <th mat-header-cell *matHeaderCellDef> N° referencia</th>
        <td mat-cell *matCellDef="let pago"> {{pago.numeroReferencia}} </td>
    </ng-container>
    <ng-container matColumnDef="Estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let pago"> {{pago.estado}} </td>
    </ng-container>
    <ng-container matColumnDef="MedioPago">
        <th mat-header-cell *matHeaderCellDef> Medio pago </th>
        <td mat-cell *matCellDef="let pago"> {{pago.medioPago}} </td>
    </ng-container>
    <ng-container matColumnDef="Importe">
        <th mat-header-cell *matHeaderCellDef> Importe </th>
        <td mat-cell *matCellDef="let pago"> {{pago.importe}} </td>
    </ng-container>
    <ng-container matColumnDef="Fecha">
        <th mat-header-cell *matHeaderCellDef> Fecha </th>
        <td mat-cell *matCellDef="let pago"> {{pago.fecha}} </td>
    </ng-container>
    <ng-container matColumnDef="Acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let pago">
            <button mat-button color="basic"style="cursor: pointer">préstamos</button>
            <button mat-button color="accent" style="cursor: pointer">Editar</button>
            <button mat-button color="warn"  style="cursor: pointer">Eliminar</button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
