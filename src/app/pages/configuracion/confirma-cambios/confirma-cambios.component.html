<h2>Confirmar cambios</h2>
<mat-divider></mat-divider>
<br>
<h3 style="text-align: justify">Los cambios que hagas modificarán
  la configuración del complejo y la vista de los usuarios.
  ¿Deseas confirmar los cambios?
</h3>
<br>
<div align="end">
  <button mat-raised-button color="basic" mat-dialog-close>
    Cerrar
  </button>
  <span style="margin-right: 20px"></span>
  <button mat-raised-button color="accent" (click)="confirmarCambios()">
    Aceptar
  </button>
</div>
