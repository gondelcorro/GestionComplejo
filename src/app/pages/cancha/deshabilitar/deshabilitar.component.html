<h2>Deshabilitar cancha</h2>
<mat-divider></mat-divider>
<br>
<h3 style="text-align: justify">Seleccioná la fecha a partir de la cuál querés deshabilitar la cancha.
  Tené en cuenta que no podés tener reservas <span style="color: #AB2A3E">pendientes</span> a partir de esa fecha.</h3>
<br>
<mat-form-field appearance=fill style="width: 100%">
  <mat-label>Seleccione una fecha</mat-label>
  <input matInput [matDatepicker]="picker" [formControl]="date" [min]="minDate" (dateChange)="onDateChange($event)" required>
  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker ></mat-datepicker>
</mat-form-field>
<br>
<br>
<br>
<div align="end">
  <button mat-raised-button color="basic" mat-dialog-close>Cancelar</button>
  <span style="margin-right: 20px"></span>
  <button mat-raised-button color="warn" (click)="confirmaDeshabilitar()">Deshabilitar</button>
</div>
